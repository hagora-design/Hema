<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصلح خير ❤️</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffe6e6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 { color: #ff4d4d; margin-top: 0; }
        p { color: #555; line-height: 1.6; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            text-align: center;
        }
        button {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover { background-color: #ff3333; }
        .hidden { display: none !important; }
        .visible { display: block !important; }
        video, img {
            width: 100%;
            border-radius: 10px;
            margin-top: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .quiz-option {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .quiz-option:hover {
            background-color: #ffe6e6;
            border-color: #ff4d4d;
        }
    </style>
</head>
<body>

<div class="container" id="loginBox">
    <h1>الصلح خير قوم اتصالح ❤️</h1>
    <p>علشان تدخل تشوف المفاجأة، اكتب البيانات الصح وبلاش دراما 😉:</p>
    <input type="text" id="username" placeholder="اسم المستخدم (حروف سمول)">
    <input type="text" id="password" placeholder="التاريخ المميز (يوم/شهر/سنة)">
    <button onclick="checkLogin()">دخول ✨</button>
</div>

<div class="container hidden" id="quizBox">
    <h1>سؤال الصلح السريع 🧐</h1>
    <p id="questionText">هل صافي يلبن وخلاص مش هتعمل دراما تاني?</p>
    <div id="optionsContainer"></div>
</div>

<div class="container hidden" id="contentBox">
    <h1>بنحبك يا هيما! ❤️ 🎉</h1>
    <p>خلاص بقى صافي يلبن بالثلاثة! عيش اللحظة الحلوة دي مع أجمل ذكرياتنا وفيديو الصلح المخصوص عشانك:</p>
    <video controls id="myVid">
        <source src="myvideo.mp4" type="video/mp4">
    </video>
    <img src="pic1.jpg" alt="ذكرياتنا الحلوة 1">
    <img src="pic2.webp" alt="ذكرياتنا الحلوة 2">
</div>

<script>
    // بيانات الكويز والأسئلة
    var quizData = [
        {
            question: "هل صافي يلبن وخلاص مش هنعمل دراما وزعل تاني؟ 🤔",
            options: ["صافي يلبن وحليب يا قشطة 😍", "لأ لسه زعلان برضه 🙄"],
            correct: 0 
        },
        {
            question: "مين أكتر حد بيحبك في الدنيا دي كلها؟ 💖",
            options: ["هاجر طبعاً من غير كلام 🥰", "محدش خالص 😢"],
            correct: 0 
        }
    ];

    var currentQuestionIndex = 0;

    // هنا مستخبي اليوزر والباسورد الصح المبرمجين عشان ينقلوه للخطوة اللي بعدها
    function checkLogin() {
        var user = document.getElementById("username").value.trim().toLowerCase();
        var pass = document.getElementById("password").value.trim();

        if (user === "love" && pass === "21/10/2024") {
            document.getElementById("loginBox").classList.add("hidden");
            document.getElementById("quizBox").classList.remove("hidden");
            document.getElementById("quizBox").classList.add("visible");
            loadQuestion();
        } else {
            alert("البيانات غلط يا بطل! اكتب اليوزر love والتاريخ 21/10/2024 بالظبط 😉");
        }
    }

    function loadQuestion() {
        var currentQuiz = quizData[currentQuestionIndex];
        document.getElementById("questionText").innerText = currentQuiz.question;
        
        var optionsContainer = document.getElementById("optionsContainer");
        optionsContainer.innerHTML = ""; 

        currentQuiz.options.forEach(function(option, index) {
            var optionDiv = document.createElement("div");
            optionDiv.className = "quiz-option";
            optionDiv.innerText = option;
            optionDiv.onclick = function() { selectOption(index); };
            optionsContainer.appendChild(optionDiv);
        });
    }

    function selectOption(selectedIndex) {
        var currentQuiz = quizData[currentQuestionIndex];
        
        if(selectedIndex === currentQuiz.correct) {
            currentQuestionIndex++;
            if(currentQuestionIndex < quizData.length) {
                loadQuestion(); 
            } else {
                document.getElementById("quizBox").classList.remove("visible");
                document.getElementById("quizBox").classList.add("hidden");
                document.getElementById("contentBox").classList.remove("hidden");
                document.getElementById("contentBox").classList.add("visible");
                
                var video = document.getElementById("myVid");
                video.play().catch(function(error) {
                    console.log("التشغيل تلقائياً محتاج ضغطة من المستخدم أولاً.");
                });
            }
        } else {
            alert("إجابة خاطئة! فكر كويس وجاوب صح عشان تفتح المفاجأة 😂❤️");
        }
    }
</script>

</body>
</html>
