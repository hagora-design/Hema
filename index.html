    <style>
        :root {
            --primary-color: #581827;
            --secondary-color: #fbebee;
            --accent-color: #c2185b;
            --text-dark: #2d3436;
            --white: #ffffff;
        }

        * { box-sizing: border-box; transition: all 0.3s ease; }

        body {
            margin: 0;
            padding: 0;
            background-color: #fce4ec;
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone-container {
            width: 100%;
            max-width: 430px;
            background: var(--white);
            min-height: 92vh;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            display: flex;
            flex-direction: column;
            margin: 15px;
        }

        .screen {
            padding: 35px 20px;
            text-align: center;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
        }

        .active { display: flex !important; animation: slideIn 0.5s ease forwards; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pink-text { font-family: 'Poppins', sans-serif; color: var(--accent-color); font-size: 13px; letter-spacing: 2px; font-weight: 600; margin-bottom: 5px; text-transform: uppercase; }
        .main-title { font-size: 32px; color: var(--primary-color); margin: 10px 0 20px 0; font-weight: 700; line-height: 1.3; }
        h2 { color: var(--primary-color); font-size: 22px; margin-bottom: 20px; font-weight: 700; line-height: 1.5; }
        p { font-size: 15px; color: #555; line-height: 1.6; margin-top: 0; }

        .btn-premium {
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            padding: 14px 35px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(88, 24, 39, 0.25);
            font-weight: bold;
            width: 85%;
            margin-top: 15px;
        }
        .btn-premium:hover { transform: translateY(-2px); background-color: var(--accent-color); box-shadow: 0 10px 20px rgba(194, 24, 91, 0.3); }

        .input-group { width: 85%; margin-bottom: 10px; display: flex; flex-direction: column; align-items: center; }
        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #f0f0f0;
            border-radius: 15px;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
            background: #fafafa;
        }
        input:focus { border-color: var(--accent-color); background: #fff; box-shadow: 0 0 8px rgba(194, 24, 91, 0.1); }

        .quiz-card { width: 100%; padding: 5px; }
        .quiz-option {
            background: #fff;
            border: 2px solid #f0f0f0;
            padding: 14px 20px;
            margin: 12px 0;
            border-radius: 18px;
            cursor: pointer;
            width: 100%;
            font-size: 15.5px;
            text-align: right;
            font-weight: 600;
            color: var(--text-dark);
            box-shadow: 0 3px 6px rgba(0,0,0,0.02);
            line-height: 1.4;
        }
        .quiz-option:hover { border-color: var(--accent-color); background: var(--secondary-color); color: var(--primary-color); }

            justify-content: center; align-items: center; border-radius: 30px;
            padding: 20px;
        }
